appId: com.token.monitor
productName: TokenMonitor
npmRebuild: false
directories:
  output: ../release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - icon.ico
  - icon.png
asarUnpack:
  - node_modules/better-sqlite3/**
  - dist-electron/main/sqlite-worker.cjs
extraResources:
  - from: .tmp/node-runtime
    to: node-runtime
    filter:
      - '**/*'
win:
  executableName: TokenMonitor
  target:
    - target: nsis
      arch:
        - x64
  icon: icon.ico
nsis:
  include: installer.nsh
  shortcutName: TokenMonitor
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  perMachine: false
